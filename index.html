<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wallet - My Ride</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7fafd; --card: #fff; --head: #f2f3f5; --line: #dfe2e6;
    --text: #111827; --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: Roboto, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
  }
  .navbar {
    background: #fff; height: 48px; padding: 0 14px;
    display: flex; align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .brand b { font-weight: 700; }
  .brand img { width: 28px; height: 28px; object-fit: contain; }
  main { width: 100%; max-width: 560px; margin: 0 auto; padding: 16px 12px 40px; }
  h1 { font-size: 19px; font-weight: 700; margin: 4px 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 24px;
  }
  .card-head { background: var(--head); padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0; font-size: 16px; font-weight: 400; }
  .vehicle {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; padding: 14px; flex-wrap: wrap;
  }
  .vehicle-info { flex: 1 1 180px; min-width: 0; }
  .plate-row { margin-bottom: 8px; }
  .plate {
    background: none; border: 0; padding: 0; margin: 0; font-family: inherit;
    color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 14px;
  }
  .plate::after { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-2px); transition: transform .2s; }
  .plate[aria-expanded="true"]::after { transform: rotate(-135deg) translateY(-2px); }
  .plate:focus-visible { outline: 2px solid rgba(37,99,235,.5); outline-offset: 3px; }
  .model { font-size: 14px; text-align: right; margin-left: auto; }
  .model b { display: block; font-weight: 700; }
  .photos { display: none; padding: 0 14px 14px; gap: 10px; flex-direction: column; }
  .photos.open { display: flex; }
  .photos a { display: block; }
  .photos img { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: #eef1f4; min-height: 100px; }
  .empty { padding: 14px; color: var(--muted); }
  @media (min-width: 640px) {
    body { font-size: 15px; }
    .photos { flex-direction: row; flex-wrap: wrap; }
    .photos a { flex: 1 1 calc(33.333% - 7px); min-width: 140px; }
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="brand">
    <!-- Replace src with your own emblem image -->
    <img src="emblem.png" alt="" onerror="this.remove()">
    <span><b>My</b> Ride</span>
  </div>
</header>

<main>
  <h1>My Wallet</h1>

  <section class="card">
    <div class="card-head vehicle-head">
      <div>
        <h2>My Vehicle Registry</h2>
        
      </div>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
  /* ============================================================
     HOW TO ADD A BIKE AND ITS PHOTOS
     ------------------------------------------------------------
     1. Upload each photo to Google Drive.
        Right-click > Share > General access > "Anyone with the link".
     2. Copy the photo link. It looks like:
        https://drive.google.com/file/d/FILE_ID/view?usp=drivesdk
     3. Copy ONLY the FILE_ID (the part between /d/ and /view).
     4. Paste each FILE_ID inside images: [ ... ] below, in quotes,
        separated by commas. Any number of photos works.
     5. To add another bike, copy one whole { ... } block, put a comma
        after the previous block, and change plate, model, make, images.
     ============================================================ */
  const vehicles = [
    {
      plate: "A0A5667",
      model: "C100MS - DREAM",
      make: "HONDA",
      images: [
        "1igLd1-vu6Ijtgp2-2P_s7e3B1huHj5du",   // photo 1 (FILE_ID)
        "18EZ3uH1gh4KysYdCNrMGO6V8uZgf9rj2",   // photo 2 (FILE_ID)
        "1uYdHoif9XQXErAO5LhxQXZIQrXduNyg2"    // photo 3 (FILE_ID)
      ]
    },
    {
      plate: "A0B5266",
      model: "C100MS - DREAM",
      make: "HONDA",
      images: [
        "1j5MoO4WtRhjPWQD5LuAJ9XgkkNVrmXHc",   // photo 1 (FILE_ID)
        "1VYcX34O1q3QsLspQ1AWPzu7l9EK0cPGh",   // photo 2 (FILE_ID)
        "1Mx2T5dbqEfruTlPrS43Tar37XyQbh0ms"    // photo 3 (FILE_ID)
      ]
    },
    {
      plate: "A0D1412",
      model: "MD26 DEGREE",
      make: "HONDA",
      images: [
        "1KJrMTX0BWAZ5JyY8h0xGIP1D9TyVIj91",   // photo 1 (FILE_ID)
        "17ptFqlmzvn1oMxkvdX5-jMmCnWsPP9Y8",   // photo 2 (FILE_ID)
        "19sVLajH1aVyh05UmLmFAjjIB6Ct-JbB0"    // photo 3 (FILE_ID)
      ]
    },
    {
      plate: "A0K3281",
      model: "CLASSIC 350",
      make: "ROYAL ENFIELD",
      images: [
        "1U_RbgfvJ2jD_kEMm2r3ZwXSdn0aLoWGU",   // photo 1 (FILE_ID)
        "1C95KtAr4MGWkgMa2T3Skc_gLQ0-oAVfb",   // photo 2 (FILE_ID)
        "1WTIDLc5CilU6X6WrSBsHDkjetauUnULy"    // photo 3 (FILE_ID)
      ]
    }
    // Add the next bike here: put a comma after the block above, then copy a { ... } block.
  ];
  const list = document.getElementById("list");

  function render(items) {
    list.innerHTML = items.length ? "" : '<div class="empty">No vehicles found.</div>';
    items.forEach((v, i) => {
      const wrap = document.createElement("div");
      wrap.className = "vehicle-wrap";
      wrap.innerHTML =
        '<div class="vehicle"><div class="vehicle-info"><div class="plate-row"><button class="plate" aria-expanded="false" aria-controls="photos-' + i + '"></button></div></div>' +
        '<div class="model"><b></b><span></span></div></div>' +
        '<div class="photos" id="photos-' + i + '"></div>';
      const btn = wrap.querySelector(".plate");
      const box = wrap.querySelector(".photos");
      btn.textContent = v.plate;
      wrap.querySelector(".model b").textContent = v.model;
      wrap.querySelector(".model span").textContent = v.make;
      let loaded = false;
      btn.addEventListener("click", () => {
        const open = box.classList.toggle("open");
        btn.setAttribute("aria-expanded", open);
        if (open && !loaded) {
          loaded = true;
          v.images.forEach((id, n) => {
            const a = document.createElement("a");
            a.href = "https://drive.google.com/file/d/" + id + "/view";
            a.target = "_blank"; a.rel = "noopener";
            const img = document.createElement("img");
            img.alt = v.plate + " photo " + (n + 1);
            img.loading = "lazy";
            img.src = "https://lh3.googleusercontent.com/d/" + id;
            img.onerror = () => { img.onerror = null; img.src = "https://drive.google.com/thumbnail?id=" + id + "&sz=w1200"; };
            a.appendChild(img);
            box.appendChild(a);
          });
        }
      });
      list.appendChild(wrap);
    });
  }

  render(vehicles);
</script>
</body>
</html>
